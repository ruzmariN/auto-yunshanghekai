[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cloudriver-manager"
version = "0.1.0"
description = "云上河开后台学习管理器（服务器状态为最终真值）"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ethan" }]
keywords = ["asyncio", "httpx", "learning-manager", "typer", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "tenacity>=8.2,<10",
]

[project.optional-dependencies]
browser = ["playwright>=1.46,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
cloudriver = "cloudriver_manager.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudriver_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
